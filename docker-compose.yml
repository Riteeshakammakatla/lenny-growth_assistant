version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lenny_assistant
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides that only make sense inside Docker's network namespace.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/lenny_assistant
      # On Linux, host.docker.internal needs the extra_hosts entry below.
      # On Docker Desktop (Mac/Windows) it works out of the box.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      TRANSCRIPTS_DIR: /app/data/transcripts
      # Performance tuning for llama3.2:3b on CPU:
      # - Keep output short so generation stays well inside the timeout.
      # - Fewer retrieved chunks = smaller prompt = faster response.
      # - Longer timeout than the default 180s as a safety net.
      LLM_MAX_TOKENS: "400"
      RETRIEVAL_TOP_K: "6"
      RETRIEVAL_MIN_SCORE: "0.20"
      OLLAMA_TIMEOUT_SECONDS: "300"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./data/transcripts:/app/data/transcripts:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
